<text x="108" y="632" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">Un solo runtime de eve; build = eve build → salida Vercel; deploy con eve deploy.</text>
<text x="108" y="652" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">Mismo /workspace en Vercel Sandbox y en microsandbox local.</text>
<text x="108" y="672" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">Workflow callbacks vía /.well-known/workflow/ ; rutas de agente vía /eve/.</text>
<text x="108" y="692" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">Modelo conmutable por AI_PROVIDER: OpenCode Go (hoy) u OpenAI (GPT-5.6/6).</text>
<text x="108" y="712" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">Supabase es externo: no es backend del sandbox, sobrevive a local y a Vercel.</text>
